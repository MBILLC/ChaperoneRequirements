name: ci
# One run per change: on its pull request (main changes only by merging one that passed), not on
# branch, main or tag pushes. Run it by hand with `gh workflow run ci.yml`.
on:
  pull_request:
  workflow_dispatch:
env:
  PILOT_RELEASE: "2026-09.1"
  PILOT_KERNEL: "0.63.1"
jobs:
  pilot:
    name: the OMG pilot implementation parses the library
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install the pilot's Jupyter kernel
        run: |
          pip install jupyter_client ipykernel
          curl -sSL -o kernel.zip "https://github.com/Systems-Modeling/SysML-v2-Pilot-Implementation/releases/download/${PILOT_RELEASE}/jupyter-sysml-kernel-${PILOT_KERNEL}.zip"
          mkdir -p "$RUNNER_TEMP/kernel" && unzip -q kernel.zip -d "$RUNNER_TEMP/kernel" && rm kernel.zip
          python "$RUNNER_TEMP/kernel/install.py" --sys-prefix --library-path="$RUNNER_TEMP/kernel/sysml/sysml.library"
      - name: Load the library and the examples, export the JSON
        run: |
          python tools/pilot_check.py ChaperoneMetadata.sysml ChaperoneUnits.sysml ChaperoneRequirements.sysml examples/Example.sysml examples/ExampleLibrary.sysml examples/Derivation.sysml --export Example --export ExampleLibrary --export DerivationExample
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pilot-export
          path: pilot-export
  sysmlpy:
    name: sysmlpy parses and analyzes the library
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install sysmlpy==0.105.0
      - run: sysmlpy analyze ChaperoneMetadata.sysml ChaperoneUnits.sysml ChaperoneRequirements.sysml
