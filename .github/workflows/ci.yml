name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  PILOT_RELEASE: "2026-09.1"
  PILOT_KERNEL: "0.63.1"
jobs:
  pilot:
    name: the OMG pilot implementation parses the library
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install the pilot's Jupyter kernel
        run: |
          pip install jupyter_client ipykernel
          curl -sSL -o kernel.zip "https://github.com/Systems-Modeling/SysML-v2-Pilot-Implementation/releases/download/${PILOT_RELEASE}/jupyter-sysml-kernel-${PILOT_KERNEL}.zip"
          mkdir -p "$RUNNER_TEMP/kernel" && unzip -q kernel.zip -d "$RUNNER_TEMP/kernel" && rm kernel.zip
          python "$RUNNER_TEMP/kernel/install.py" --sys-prefix --library-path="$RUNNER_TEMP/kernel/sysml/sysml.library"
      - name: Load the library and the probe, export the JSON
        run: |
          python tools/pilot_check.py ChaperoneMetadata.sysml ChaperoneUnits.sysml examples/Probe.sysml \
            --magic "%help" --magic "%help %export" --export Probe --export ChaperoneMetadata
      - name: Where the export went
        if: always()
        run: |
          find "$PWD" /tmp "$HOME" -type f -mmin -10 \( -name "*.json" -o -name "*.sysml.json" \) 2>/dev/null | grep -v "/.cache\|runtime/kernel\|/_temp/\|_actions" | head
          mkdir -p pilot-export
          find /tmp "$HOME" "$PWD" -type f -mmin -10 -name "*.json" 2>/dev/null | grep -i -E "probe|chaperone|export" | xargs -r -I{} cp {} pilot-export/ || true
          ls -la pilot-export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-export
          path: pilot-export
